<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e293b">
    <title>Sin conexión - MAS Finance</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px 16px; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b); color: #e2e8f0; text-align: center;
        }
        .card { max-width: 360px; width: 100%; }
        img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 20px; }
        h1 { font-size: 1.35rem; margin: 0 0 8px; color: #fff; }
        p { margin: 0 0 24px; color: #94a3b8; line-height: 1.5; }
        button {
            border: 0; border-radius: 10px; padding: 12px 20px; font-size: 0.95rem; font-weight: 600;
            background: #2563eb; color: #fff; cursor: pointer; width: 100%;
        }
        button:active { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="card">
        <img src="/static/icons/icon-192.png" alt="MAS Finance">
        <h1>Sin conexión</h1>
        <p>No pudimos conectar con MAS Finance. Revisa tu conexión a internet e inténtalo de nuevo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
</body>
</html>
