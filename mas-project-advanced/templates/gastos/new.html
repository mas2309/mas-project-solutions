{% extends "base.html" %}

{% block title %}Nuevo Gasto - MAS Finance{% endblock %}
{% block page_title %}Nuevo Gasto{% endblock %}
{% block nav_gastos %}active text-white bg-sidebar-hover{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Registrar Gasto</h2>
        <p class="text-gray-500 mt-1">Agrega un nuevo egreso o pago</p>
    </div>

    <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">
        <form method="post" action="/gastos">
            <div class="space-y-5">
                <div>
                    <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción *</label>
                    <input type="text" id="descripcion" name="descripcion" required placeholder="Ej: Mercado semanal"
                        class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="monto" class="block text-sm font-medium text-gray-700 mb-1">Monto *</label>
                        <input type="number" id="monto" name="monto" step="0.01" min="0" required
                            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                    </div>
                    <div>
                        <label for="fecha" class="block text-sm font-medium text-gray-700 mb-1">Fecha *</label>
                        <input type="date" id="fecha" name="fecha" required
                            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">Categoría *</label>
                        <select id="categoria" name="categoria" required
                            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                            <option value="Alimentacion">Alimentación</option>
                            <option value="Transporte">Transporte</option>
                            <option value="Servicios">Servicios</option>
                            <option value="Salud">Salud</option>
                            <option value="Educacion">Educación</option>
                            <option value="Entretenimiento">Entretenimiento</option>
                            <option value="Hogar">Hogar</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>
                    <div>
                        <label for="responsable" class="block text-sm font-medium text-gray-700 mb-1">Responsable (opcional)</label>
                        <input type="text" id="responsable" name="responsable" placeholder="Ej: Juan"
                            class="w-full px-3 py-2.5 border border-gray-300 rounded-lg text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-colors">
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-end space-x-3 mt-8 pt-5 border-t border-gray-100">
                <a href="/gastos" class="px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="px-5 py-2.5 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition-colors shadow-sm">
                    Registrar Gasto
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
