name: Deploy to Stage

on:
  push:
    tags:
      - 'v*-rc*'

env:
  SERVICE_NAME: mas-project-advanced
  IMAGE: ghcr.io/${{ github.repository_owner }}/mas-project-advanced
  WORKING_DIR: mas-project-advanced

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          docker build -t ${{ env.IMAGE }}:$TAG -t ${{ env.IMAGE }}:stage .
          docker push ${{ env.IMAGE }}:$TAG
          docker push ${{ env.IMAGE }}:stage

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: stage
    steps:
      - name: Deploy to VPS
        env:
          SSHPASS: ${{ secrets.VPS_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            CONTAINER="mas-project-advanced"
            IMAGE="ghcr.io/${{ github.repository_owner }}/mas-project-advanced:${{ github.ref_name }}"
            NETWORK="mas-network"

            docker network create $NETWORK 2>/dev/null || true
            docker network connect $NETWORK global-mas-postgres 2>/dev/null || true

            docker stop $CONTAINER 2>/dev/null || true
            docker rm $CONTAINER 2>/dev/null || true
            docker rmi $(docker images --filter=reference="ghcr.io/*/mas-project-advanced*" -q) 2>/dev/null || true

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            docker pull $IMAGE

            docker run -d \
              --name $CONTAINER \
              --restart unless-stopped \
              --network $NETWORK \
              -p ${{ vars.HOST_PORT }}:8080 \
              -e TZ=America/Bogota \
              -e ENVIRONMENT=production \
              -e SERVER_HOST=0.0.0.0 \
              -e SERVER_PORT=8080 \
              -e DB_HOST="${{ secrets.DB_HOST }}" \
              -e DB_PORT="${{ secrets.DB_PORT }}" \
              -e DB_NAME="${{ secrets.DB_NAME }}" \
              -e DB_USER="${{ secrets.DB_USER }}" \
              -e DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              -e DB_SCHEMA="${{ secrets.DB_SCHEMA }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e JWT_EXPIRATION_HOURS="${{ secrets.JWT_EXPIRATION_HOURS }}" \
              -e ADMIN_DEFAULT_PASSWORD="${{ secrets.ADMIN_DEFAULT_PASSWORD }}" \
              -e STORAGE_ENDPOINT="${{ secrets.STORAGE_ENDPOINT }}" \
              -e STORAGE_TENANT_ID="${{ secrets.STORAGE_TENANT_ID }}" \
              -e CONTABO_ACCESS_KEY="${{ secrets.CONTABO_ACCESS_KEY }}" \
              -e CONTABO_SECRET_KEY="${{ secrets.CONTABO_SECRET_KEY }}" \
              -e STORAGE_BUCKET_PROYECTOS="${{ secrets.STORAGE_BUCKET_PROYECTOS }}" \
              -e STORAGE_BUCKET_DOCUMENTOS="${{ secrets.STORAGE_BUCKET_DOCUMENTOS }}" \
              -e STORAGE_BUCKET_GASTOS="${{ secrets.STORAGE_BUCKET_GASTOS }}" \
              $IMAGE
          ENDSSH

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Set status message
        id: status
        run: |
          if [[ "${{ needs.deploy.result }}" == "success" ]]; then
            echo "emoji=✅" >> $GITHUB_OUTPUT
            echo "text=Deploy exitoso" >> $GITHUB_OUTPUT
          else
            echo "emoji=❌" >> $GITHUB_OUTPUT
            echo "text=Deploy fallido" >> $GITHUB_OUTPUT
          fi

      - name: Notify Slack
        if: vars.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ vars.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.status.outputs.emoji }} *${{ env.SERVICE_NAME }}* | `${{ github.ref_name }}` → *stage*\n${{ steps.status.outputs.text }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|Ver pipeline>"
            }

      - name: Notify Microsoft Teams
        if: vars.TEAMS_WEBHOOK_URL != ''
        run: |
          curl -H "Content-Type: application/json" -d '{
            "text": "${{ steps.status.outputs.emoji }} **${{ env.SERVICE_NAME }}** | `${{ github.ref_name }}` → **stage** — ${{ steps.status.outputs.text }} — [Ver pipeline](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          }' ${{ vars.TEAMS_WEBHOOK_URL }}
